# Stream and its database's migrations, which run first, each time it's
# started: a migration that fails leaves the stream that's running as it is.
# Put it behind a reverse proxy that serves it over HTTPS at BETTER_AUTH_URL;
# passkeys and the platforms' sign-in need HTTPS.
services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    restart: 'no'

  stream:
    build: .
    container_name: stream
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Its secrets: the sign-in secret, the database, the mail server and the
    # platforms' client secrets. Never in the repository.
    env_file: .env
    # For a reverse proxy on the same machine. One in Docker can reach it on
    # a shared network instead: add that in a compose.override.yaml.
    ports:
      - '127.0.0.1:${STREAM_PORT:-3000}:3000'
